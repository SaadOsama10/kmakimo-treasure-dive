<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="675" height="900" viewBox="0 0 675 900">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd6ec"/><stop offset="0.35" stop-color="#0e6f9e"/>
      <stop offset="0.75" stop-color="#0a4a70"/><stop offset="1" stop-color="#041d33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bub" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="0.5" stop-color="#bfefff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bfefff" stop-opacity="0.35"/>
    </radialGradient>
    <g id="fish"><path d="M0 0 C 14 -16 38 -16 50 0 C 38 16 14 16 0 0 Z"/><path d="M-2 0 L-20 -13 L-20 13 Z"/><circle cx="38" cy="-3" r="2.6" fill="#0a2a40"/></g>
  </defs>
  <rect width="675" height="900" fill="url(#sea)"/>
  <rect width="675" height="500" fill="url(#glow)"/>
  <g fill="url(#ray)">
    <polygon points="260,0 330,0 470,620 220,620"/><polygon points="400,0 440,0 640,560 520,560"/>
    <polygon points="120,0 170,0 150,560 20,560"/>
  </g>
  <!-- background fish (original shapes) -->
  <g fill="#7fe0b0" opacity="0.85"><use xlink:href="#fish" transform="translate(70 190) scale(1.1)"/></g>
  <g fill="#c98bff" opacity="0.85"><use xlink:href="#fish" transform="translate(560 300) scale(-0.9 0.9)"/></g>
  <g fill="#ffd76a" opacity="0.8"><use xlink:href="#fish" transform="translate(500 120) scale(-0.6 0.6)"/></g>
  <g fill="#ff9ec0" opacity="0.75"><use xlink:href="#fish" transform="translate(40 420) scale(0.7)"/></g>
  <!-- seabed -->
  <path d="M0 800 Q 170 760 340 800 T 675 780 L675 900 L0 900 Z" fill="#0a3550"/>
  <path d="M0 850 Q 200 820 400 850 T 675 840 L675 900 L0 900 Z" fill="#062638"/>
  <!-- seaweed -->
  <g fill="none" stroke="#2fae6e" stroke-width="14" stroke-linecap="round">
    <path d="M60 820 C 30 760 90 720 55 650"/><path d="M95 830 C 70 780 120 750 100 700"/>
    <path d="M600 820 C 630 760 570 720 610 640"/><path d="M635 830 C 655 790 620 760 640 720"/>
  </g>
  <!-- coral -->
  <g fill="#ff7a6a"><circle cx="190" cy="815" r="18"/><circle cx="215" cy="800" r="14"/><circle cx="170" cy="800" r="12"/></g>
  <g fill="#b46bff"><rect x="470" y="780" width="14" height="50" rx="7"/><rect x="494" y="765" width="14" height="65" rx="7"/><rect x="518" y="790" width="14" height="40" rx="7"/></g>
  <!-- treasure -->
  <g transform="translate(300 805)">
    <rect x="-34" y="-14" width="68" height="34" rx="6" fill="#8a5a22"/><rect x="-34" y="-14" width="68" height="12" rx="6" fill="#a8742f"/>
    <rect x="-4" y="-6" width="8" height="12" fill="#ffd76a"/>
    <circle cx="-8" cy="-20" r="8" fill="#ffd76a"/><circle cx="8" cy="-22" r="8" fill="#ffe27a"/>
  </g>
  <!-- hero sprite -->
  <image href="../assets/player.png" x="127" y="210" width="421" height="491" preserveAspectRatio="xMidYMid meet"/>
  <!-- bubbles -->
  <g fill="url(#bub)" stroke="#e6faff" stroke-opacity="0.5" stroke-width="1.5">
    <circle cx="90" cy="330" r="16"/><circle cx="125" cy="260" r="9"/><circle cx="560" cy="440" r="14"/>
    <circle cx="600" cy="200" r="11"/><circle cx="300" cy="120" r="12"/><circle cx="380" cy="80" r="7"/>
    <circle cx="520" cy="560" r="8"/><circle cx="140" cy="560" r="12"/><circle cx="460" cy="250" r="6"/>
    <circle cx="70" cy="620" r="7"/><circle cx="610" cy="650" r="16"/><circle cx="230" cy="700" r="7"/>
  </g>
</svg>
